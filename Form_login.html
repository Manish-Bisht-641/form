<html>
<head>
    <title>Login Form With Button Tag</title>
</head>
<body>
<center>
<h2>Login Here</h2>

<form>
    <label>User ID:</label>
    <input type="text" name="userid">
    <br><br>

    <label>Password:</label>
    <input type="password" name="password">
    <br><br>

    <button type="reset">Reset</button>
    <button type="submit">Submit</button>
</form>
</center>
</body>
</html>
